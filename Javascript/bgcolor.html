<!DOCTYPE html>
<html>
<head>
    <title>Background Color Change</title>
</head>
<body>

    <button id="colorbtn">change color</button>
    </button>

    <script>
       let c=document.getElementById("colorbtn");
       c.addEventListener("click",function(){
        document.body.style.backgroundColor="purple";
       })
    </script>
</body>
</html>
